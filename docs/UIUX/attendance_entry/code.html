<script>
        // Simple script to handle "Mark All Present" toggle functionality
        const presentAllToggle = document.getElementById('presentAllToggle');
        const studentToggles = document.querySelectorAll('input[name^="toggle-"]');

        presentAllToggle.addEventListener('change', function() {
            const isChecked = this.checked;
            studentToggles.forEach(toggle => {
                toggle.checked = isChecked;
            });
        });
    </script>
