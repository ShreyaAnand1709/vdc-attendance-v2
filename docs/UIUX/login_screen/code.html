<body class="h-full flex items-center justify-center bg-surface-container-lowest md:bg-background text-on-surface p-margin-mobile md:p-margin-desktop antialiased">
<div class="w-full max-w-md bg-surface md:shadow-level-2 rounded-2xl md:rounded-[24px] overflow-hidden flex flex-col h-full md:h-auto">
<!-- Header / Illustration Area -->
<div class="relative h-48 bg-surface-container-low shrink-0 flex items-center justify-center overflow-hidden">
<div class="absolute inset-0 bg-primary/5"></div>
<img alt="Academic Illustration" class="w-full h-full object-cover opacity-80" data-alt="A subtle, modern academic illustration in light mode. It features abstract geometric representations of books and a graduation cap in soft blues and whites. The style is minimalist corporate, suitable for a professional education management tool. High-key lighting, clean vector-like aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBKLgIwKtim6_3gUugQHvkzsHS3mQfXec9jTXKTht3pkb8tWNfiyXabbGDW2ZzkDgWG2Vxa50fZTrBOHkbYddGd8-oL3R2e-poQNZMdBDtWXoN_n4KeeBXeKHnbD-UGEwUR395f36lQtaVBfzBOTzA3vuaofeVqhxnqVdznv88ZJHDsobJNraDO3mE5cRJcI_W7zNbHjIGkajNpMmJxiUsIgchLXkisC3yi0YJR2zaMV6lzp3IoV82PfA"/>
<div class="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-surface to-transparent">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">school</span>
<h1 class="text-title-lg font-title-lg font-bold text-primary">EduManage</h1>
</div>
<h2 class="text-headline-md font-headline-md text-on-surface">Welcome back</h2>
<p class="text-body-md font-body-md text-on-surface-variant mt-1">Please enter your details to sign in.</p>
</div>
</div>
<!-- Form Area -->
<div class="p-6 md:p-8 flex-grow flex flex-col justify-center">
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div>
<label class="block text-label-lg font-label-lg text-on-surface-variant mb-unit" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline rounded-lg bg-surface text-body-lg font-body-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-colors min-h-[48px]" id="email" name="email" placeholder="teacher@school.edu" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block text-label-lg font-label-lg text-on-surface-variant mb-unit" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline rounded-lg bg-surface text-body-lg font-body-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-colors min-h-[48px]" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-primary transition-colors min-w-[48px] justify-center focus:outline-none focus:ring-2 focus:ring-primary rounded-lg" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between mt-4">
<div class="flex items-center min-h-[48px]">
<input class="h-5 w-5 rounded border-outline text-primary focus:ring-primary bg-surface" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-body-md font-body-md text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-label-lg font-label-lg">
<a class="font-medium text-primary hover:text-primary-container min-h-[48px] inline-flex items-center p-2 -mr-2 rounded focus:outline-none focus:ring-2 focus:ring-primary" href="#">
                            Forgot password?
                        </a>
</div>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-label-lg font-label-lg font-medium text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors min-h-[48px] items-center uppercase tracking-wider" type="submit">
                        Login
                    </button>
</div>
</form>
<div class="mt-8 text-center">
<p class="text-body-md font-body-md text-on-surface-variant">
                    Need help? <a class="font-medium text-primary hover:text-primary-container focus:outline-none focus:underline p-1 rounded" href="#">Contact IT Support</a>
</p>
</div>
</div>
</div>
</body></html>
