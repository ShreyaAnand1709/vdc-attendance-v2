<script>
        // Simple inline validation script for demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.mark-input');
            const enteredCountDisplay = document.getElementById('entered-count');
            
            function updateValidationAndCount() {
                let count = 0;
                inputs.forEach(input => {
                    const val = input.value;
                    const max = parseInt(input.getAttribute('data-max'), 10);
                    const errorMsg = input.closest('.student-row').querySelector('.error-msg');
                    
                    if (val !== '') {
                        count++;
                        if (parseInt(val, 10) > max) {
                            input.classList.add('input-error');
                            if(errorMsg) errorMsg.classList.remove('hidden');
                        } else {
                            input.classList.remove('input-error');
                            if(errorMsg) errorMsg.classList.add('hidden');
                        }
                    } else {
                        input.classList.remove('input-error');
                        if(errorMsg) errorMsg.classList.add('hidden');
                    }
                });
                if(enteredCountDisplay) enteredCountDisplay.textContent = count;
            }

            inputs.forEach(input => {
                input.addEventListener('input', updateValidationAndCount);
            });
            
            // Initial check to highlight pre-filled errors (like student 3)
            updateValidationAndCount();
        });
    </script>
